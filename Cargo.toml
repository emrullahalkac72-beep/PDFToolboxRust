[package]
name = "pdf-toolbox"
version = "1.0.0"
edition = "2021"
authors = ["Emrullah ALKAÇ"]
description = "PDF Toolbox - PDF birleştirme, bölme, düzenleme, OCR ve dönüştürme araçları"

[dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["glow", "default_fonts", "accesskit", "x11", "wayland"] }
rfd = { version = "0.15.4", default-features = false }
anyhow = "1.0"
thiserror = "2.0"
lopdf = "0.46.0"
printpdf = { version = "0.12.8", default-features = false, features = ["images", "png", "jpeg"] }
hayro = "0.8.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "tiff", "bmp", "webp", "ico"] }
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
quick-xml = "0.37"
regex = "1.11"
tempfile = "3.20"
pdf-extract = "0.12.1"
rayon = "1.11"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
